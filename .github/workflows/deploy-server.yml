name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SERVER_IP: 173.212.251.191
      WEB_ROOT: /var/www/taj-elite-demo
      APP_PORT: 8020

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build pages
        run: python tools/build_pages.py

      - name: Collect site files
        run: |
          mkdir -p dist
          cp -r index.html sitemap.xml robots.txt assets dist/
          # every folder that holds a page (treatments, doctors, news, old-URL redirects)
          for d in */; do
            d="${d%/}"
            case "$d" in assets|tools|dist|node_modules) continue ;; esac
            [ -f "$d/index.html" ] && cp -r "$d" dist/
          done
          # staging copy: keep it out of search results (the real site lives on taj-elite.com)
          cp .deploy/serve.json dist/serve.json
          # mark every page of this server copy as a demo (label sits next to the logo)
          find dist -name index.html -exec sed -i 's#<a class="brand"#<span class="demo-tag">DEMO</span><a class="brand"#' {} +
          echo "Demo labels: $(grep -rl 'class="demo-tag"' dist | wc -l)"
          echo "Pages: $(find dist -name index.html | wc -l)"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sshpass -p "$SERVER_PASS" scp -o StrictHostKeyChecking=no .deploy/deploy-frontend.sh "$SERVER_USER@$SERVER_IP:/tmp/deploy-taj-elite-demo.sh"
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "rm -rf /tmp/taj-elite-demo-dist && mkdir -p /tmp/taj-elite-demo-dist"
          sshpass -p "$SERVER_PASS" scp -o StrictHostKeyChecking=no -r dist/* "$SERVER_USER@$SERVER_IP:/tmp/taj-elite-demo-dist/"
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" \
            "chmod +x /tmp/deploy-taj-elite-demo.sh && \
             WEB_ROOT='$WEB_ROOT' \
             SERVER_USER='$SERVER_USER' \
             BUILD_DIR='/tmp/taj-elite-demo-dist' \
             APP_PORT='$APP_PORT' \
             /tmp/deploy-taj-elite-demo.sh"

      - name: Check the site responds
        run: |
          sleep 3
          curl -fsS -o /dev/null -w "Public check: HTTP %{http_code}\n" "http://${SERVER_IP}:${APP_PORT}/" || echo "Port ${APP_PORT} may be closed in the server firewall (see README)."

      - name: Publish service URL
        run: |
          echo "Site URL: http://${SERVER_IP}:${APP_PORT}" >> $GITHUB_STEP_SUMMARY
