# Optional: serve Taj Elite on a (sub)domain through nginx on port 80.
# Not needed for http://173.212.251.191:8020 — only when a domain points at this server.
# Does NOT replace Turathna's default_server block.
#
#   sudo cp nginx-taj-elite.conf /etc/nginx/sites-available/taj-elite
#   sudo ln -s /etc/nginx/sites-available/taj-elite /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name taj-elite.example.com;   # ← replace with the real (sub)domain

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
